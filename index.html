<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/TcgPlaceholderGen/pokeball.svg" />
  <link rel="manifest" href="/TcgPlaceholderGen/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCG Master Set Placeholder Generator</title>
  <meta name="description" content="Generate printable placeholders for TCG master sets" />
  <link rel="apple-touch-icon" href="/TcgPlaceholderGen/icon-192.png" />
</head>

<body class="bg-slate-950 text-slate-50 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  <script>
    // Asset load error handling (e.g. 404 on hashed JS/CSS files)
    window.addEventListener('error', function (e) {
      if (e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
        console.warn('Asset failed to load:', e.target.src || e.target.href);
        // Only reload if we haven't already reloaded recently to avoid loops
        const lastReload = sessionStorage.getItem('last_asset_reload');
        const now = Date.now();
        if (!lastReload || (now - parseInt(lastReload)) > 10000) {
          sessionStorage.setItem('last_asset_reload', now.toString());
          console.log('Detected stale assets. Force reloading page...');
          window.location.reload(true);
        }
      }
    }, true);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/TcgPlaceholderGen/sw.js');
      });
    }
  </script>
</body>

</html>
